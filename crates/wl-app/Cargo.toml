[package]
name = "wl-app"
version.workspace = true
edition.workspace = true
description = "Prototype desktop packet viewer on top of tshark"

[[bin]]
name = "pilotfish"
path = "src/main.rs"

[dependencies]
wl-model.workspace = true
wl-tshark.workspace = true
wl-stats.workspace = true
wl-kit.workspace = true
wl-panels.workspace = true
eframe.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive"] }
dirs = "7"
rfd = "0.18"
signal-hook = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
mimalloc = "0.1.52"
maxminddb = "0.33.0"
dns-lookup = "4.0.2"
ureq = "3"
flate2 = "1.1.11"
chrono = "0.4.45"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.deb]
name = "pilotfish"
maintainer = "anyhowfeel <346877873+anyhowfeel@users.noreply.github.com>"
copyright = "pilotfish contributors"
license-file = ["../../LICENSE", "0"]
section = "net"
priority = "optional"
depends = "$auto, tshark"
extended-description = "Prototype desktop packet viewer written in Rust with egui. Captures are read and filtered by tshark and dumpcap; pilotfish shows them as tables, charts and a host graph."
assets = [
    ["target/release/pilotfish", "usr/bin/", "755"],
    ["../../packaging/linux/pilotfish.desktop", "usr/share/applications/", "644"],
    ["../../assets/logo/pilotfish.svg", "usr/share/icons/hicolor/scalable/apps/pilotfish.svg", "644"],
    ["../../assets/logo/pilotfish-256.png", "usr/share/icons/hicolor/256x256/apps/pilotfish.png", "644"],
    ["../../README.md", "usr/share/doc/pilotfish/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/pilotfish/CHANGELOG.md", "644"],
]
