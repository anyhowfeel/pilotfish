[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
wl-model = { path = "crates/wl-model" }
rayon = "1"
wl-tshark = { path = "crates/wl-tshark" }
wl-native = { path = "crates/wl-native" }
wl-hybrid = { path = "crates/wl-hybrid" }
wl-planar = { path = "crates/wl-planar" }
wl-stats = { path = "crates/wl-stats" }
wl-kit = { path = "crates/wl-kit" }
wl-panels = { path = "crates/wl-panels" }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
crossbeam-channel = "0.5"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# The layout search is compute-heavy and runs against a time budget: unoptimised it gets through a
# fraction of the work, and its tests take minutes.
[profile.dev.package.wl-planar]
opt-level = 3
