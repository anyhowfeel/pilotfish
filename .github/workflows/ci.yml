name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # This job always starts, so the required check is reported on every pull request, but it only
    # builds when a path that can change the result was touched.
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether the code changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; else base=""; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD | grep -Eq '^(crates/|tests/|packaging/|tools/|\.github/workflows/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No code, test, packaging or workflow change: nothing to check."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - name: System packages
        if: steps.scope.outputs.code == 'true'
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            tshark pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev
          # Let the tests capture on the loopback interface.
          sudo chmod 755 "$(command -v dumpcap)"
          sudo setcap cap_net_raw,cap_net_admin+eip "$(command -v dumpcap)"
          # Unload AppArmor profiles that block tshark/dumpcap from reading workspace fixtures.
          for p in $(grep -lE 'tshark|dumpcap|capinfos|editcap|mergecap' /etc/apparmor.d/* 2>/dev/null || true); do
            sudo apparmor_parser -R "$p" || true
          done
      - name: Rust toolchain
        if: steps.scope.outputs.code == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.code == 'true'
      - name: Version files agree
        if: steps.scope.outputs.code == 'true'
        run: tools/check-version.sh
      - name: fmt, clippy, tests
        if: steps.scope.outputs.code == 'true'
        run: tools/check.sh
